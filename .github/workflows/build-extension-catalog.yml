name: Build and Release Extension Catalog

on:
  workflow_dispatch:
  release:
    types: [released]

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  build-extension-catalog:
    uses: ./.github/workflows/build-extension-catalog-pandaria.yml
    permissions:
      actions: write
      contents: write
      packages: write
    with:
      registry_target: registry.rancher.cn
      registry_user: ${{ vars.TCR_USERNAME }}
      tagged_release: ${{ github.ref_name }}
    secrets:
      registry_token: ${{ secrets.TCR_TOKEN }}
